# Repository configuration for the GitHub Copilot app.
#
# The authoritative instructions for this repository are in AGENTS.md. This file
# points at them rather than restating them, so the two cannot drift apart.

instructions: |
  Read AGENTS.md in the repository root and follow it. It is the authoritative
  guidance for this repository.

  The three rules most often broken here:

  1. Info.plist is generated by scripts/build.sh. Never hardcode a version, a
     bundle identifier, or a copyright line. CFBundleIdentifier is
     com.trsdn.oft-eml-converter and does not change.
  2. Never run the release or notarization scripts, and never create or move a
     tag. A v* tag publishes a signed, notarized artifact to users.
  3. The app makes no runtime network calls and the site loads no external
     resources. Both properties are assessed.

  Run the Validate script before proposing any change.

scripts:
  - name: Validate
    command: ./scripts/test.sh
  - name: Build
    command: ./scripts/build.sh

automation:
  auto_issue_session: true
  remote_control: false
